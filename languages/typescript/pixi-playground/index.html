<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <title>PixiJS - Template</title>
  </head>

  <body>
    <div id="app">
      <div id="pixi-container"></div>
      <div id="controls">
        <label
          ><input type="checkbox" id="kpi-toggle" autocomplete="off" checked />
          KPIs</label
        >
        <label
          >View
          <select id="projection" autocomplete="off">
            <option value="flat" selected>Flat</option>
            <option value="dimetric">Dimetric (2:1)</option>
            <option value="isometric">Isometric</option>
            <option value="trimetric">Trimetric</option>
          </select>
        </label>
        <label class="hidden"
          >Theme
          <select id="theme" autocomplete="off">
            <option value="">Boxes</option>
          </select>
        </label>
        <button id="pause"></button>
        <button id="slower">−</button>
        <span id="speed"></span>
        <button id="faster">+</button>
        <span class="group">Zoom</span>
        <button id="zoom-out" title="Zoom out">−</button>
        <span id="zoom"></span>
        <button id="zoom-in" title="Zoom in">+</button>
        <span id="time"></span>
        <label
          >Throughput over
          <select id="window" autocomplete="off">
            <option value="900000">15 min</option>
            <option value="3600000" selected>1 h</option>
            <option value="14400000">4 h</option>
          </select>
        </label>
      </div>
      <div id="kpis"></div>
      <div id="tooltip"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
