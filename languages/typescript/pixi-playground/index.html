<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <title>PixiJS - Template</title>
  </head>

  <body>
    <div id="app">
      <div id="pixi-container"></div>
      <div id="controls">
        <button id="projection-toggle"></button>
        <button id="pause"></button>
        <button id="slower">−</button>
        <span id="speed"></span>
        <button id="faster">+</button>
        <span class="group">Zoom</span>
        <button id="zoom-out" title="Zoom out">−</button>
        <span id="zoom"></span>
        <button id="zoom-in" title="Zoom in">+</button>
        <span id="time"></span>
        <label
          >Throughput over
          <select id="window">
            <option value="900000">15 min</option>
            <option value="3600000" selected>1 h</option>
            <option value="14400000">4 h</option>
          </select>
        </label>
      </div>
      <div id="tooltip"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
